# SonarCloud — FUXIA (solo código de producción)
# NOTA: ajusta sonar.projectKey y sonar.organization a los valores que
# muestra SonarCloud al importar el repo (Paso 1 del README).
sonar.projectKey=fuxia-agencia
sonar.organization=fuxia-oficial
sonar.host.url=https://sonarcloud.io

sonar.sources=landing,trafico-web
sonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.glb,**/*.ttf,**/three.module.min.js,**/loaders/**,**/*.md,**/*.txt
sonar.sourceEncoding=UTF-8

sonar.links.homepage=https://fuxia-landing.vercel.app
