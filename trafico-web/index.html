.fx-doc summary:before { content: "+ "; font-weight: 700; }
.fx-doc[open] summary:before { content: "\u2013 "; }
.fx-doc pre { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.75; color: ${ge}; white-space: pre-wrap; word-break: break-word; padding-bottom: 14px; }
.fx-task { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border: none; border-bottom: 1px solid ${F}; background: transparent; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.fx-task:last-child { border-bottom: none; }
.fx-cb { width: 20px; height: 20px; border: 1.5px solid ${da}; border-radius: 4px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #000; font-weight: 700; }
.fx-cb.on { background: ${k}; border-color: ${k}; }
.fx-txt { font-size: 14.5px; line-height: 1.65; color: ${ge}; }
.fx-txt.on { color: ${da}; text-decoration: line-through; }
.fx-bar { height: 7px; background: ${Pe}; border-radius: 4px; overflow: hidden; }
.fx-bar > div { height: 100%; border-radius: 4px; }
.fx-copybtn { background: transparent; border: 1px solid ${F}; color: ${ge}; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 6px; cursor: pointer; }
.fx-copybtn:hover { border-color: ${k}; color: #F072FF; }
.fx-btn { background: ${k}; border: none; color: #000; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
.fx-btn:hover { opacity: 0.9; }
.fx-in { background: ${Pe}; border: 1px solid ${F}; color: ${ge}; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; padding: 9px 11px; border-radius: 8px; width: 100%; outline: none; }
.fx-in:focus { border-color: ${k}; }
.fx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.fx-fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.fx-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 0; border-bottom: 0.5px solid ${F}; }
.fx-row:last-child { border-bottom: none; }
.scrollx { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scrollx::-webkit-scrollbar { display: none; }
.fx-sticky-prog { position: sticky; top: 0; z-index: 20; background: rgba(7,7,7,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(224,64,251,0.28); padding: 8px 20px; }
.fx-badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 14px; border: 1px solid ${F}; color: ${ge}; background: rgba(255,255,255,0.05); }
@media (max-width: 640px) {
  .fx-h1 { font-size: 22px; }
  .fx-card { padding: 14px 14px; }
  .fx-tab { font-size: 12px; padding: 10px 11px; letter-spacing: 0.06em; }
  .fx-day { min-width: 38px; height: 38px; }
