Qui\xE9n es el cliente:
- Negocios de productos, tiendas de celulares y accesorios, servicios locales (salud, est\xE9tica, t\xE9cnico, remodelaci\xF3n) y alimentos/reposter\xEDa.
- 1 a 3 sedes en Medell\xEDn o \xE1rea metropolitana.
- Due\xF1o o administrador que atiende WhatsApp e Instagram.
- Entre 5 y 50 mensajes diarios.
- Sin CRM, sin seguimiento sistematizado y con pauta irregular.

Dolores que le quitamos:
- Responde tarde y el cliente compra en otro lado.
- Anota leads en cuaderno o los pierde en el chat.
- Publica todos los d\xEDas, pero no tiene oferta clara.
- Pauta sin medici\xF3n: no sabe qu\xE9 anuncio trae ventas.

Se\xF1ales de buen prospecto:
- Vende o agenda por WhatsApp o Instagram.
- Tiene cat\xE1logo, Google Maps o p\xE1gina web desactualizada.
- Publica contenido, pero no tiene estrategia.
- Ya invirti\xF3 en pauta, aunque sea poco.

Promesa FUXIA:
"Te montamos un sistema de captaci\xF3n y seguimiento por WhatsApp en 30 d\xEDas. No solo posts: clientes."

"Soy Ferney, de FUXIA. Ayudo a negocios locales en Medell\xEDn a vender m\xE1s por WhatsApp con contenido, anuncios medidos y seguimiento."`},precios:{t:"Packs, precios y add-ons",txt:`PACKS FUXIA MARKETING (COP, sin IVA \xB7 +19% si requiere factura con IVA)

DIAGN\xD3STICO \u2014 Gratis (15 min)
- Auditor\xEDa express de Instagram, WhatsApp y pauta actual.
- 3 oportunidades concretas. Sin compromiso.

1) ARRANQUE \u2014 $1.500.000 (pago \xFAnico)
- Landing de conversi\xF3n + WhatsApp + pixel + UTMs.
- Perfiles optimizados (IG/FB) + highlights.
- 4 piezas de contenido + guion de 2 reels.
- Campa\xF1a de Meta Ads configurada (pauta aparte).

2) CRECIMIENTO \u2014 Mes 1: $1.500.000 (solo setup, lanzamiento incluido \xB7 opci\xF3n 50/50) \xB7 desde mes 2: $750.000/mes (recomendado)
- Setup = pago \xFAnico inicial donde montamos tu sistema base (landing, WhatsApp, medici\xF3n de anuncios, perfiles y campa\xF1a).
- Todo lo de Arranque.
- 8 piezas/mes + stories + guiones.
- Gesti\xF3n de Meta Ads (pauta aparte: $300k-$600k/mes).
- Respuestas y seguimiento por WhatsApp con plantillas.
- Reporte mensual: leads, conversaciones, CPL y ventas.

3) ESCALA \u2014 Mes 1: $2.500.000 (solo setup completo, lanzamiento incluido \xB7 opci\xF3n 50/50) \xB7 desde mes 2: $1.200.000/mes
- Setup = pago \xFAnico inicial para montar sistema base + CRM, automatizaciones n8n, IA y dashboard.
- Todo lo de Crecimiento.
- 12 piezas/mes + 4 reels.
- CRM simple + automatizaci\xF3n con n8n + IA de respuesta.
- Dashboard de m\xE9tricas y reuni\xF3n quincenal.
- Onboarding del equipo de ventas.

PRODUCTOS DE ENTRADA (puente sin fricci\xF3n)
- Links Pro: $250.000 \xB7 Google Maps: $300.000 \xB7 Combo Presencia: $550.000 (100% abonable si en 30 d\xEDas pasa a Arranque o Crecimiento).
- Piloto fundador (1-2 cupos por DM/llamada): descuento por caso documentado + testimonio.

PAUTA
- Se paga directo a Meta con tarjeta del cliente.
- Inicio recomendado: $300.000-$600.000/mes.
- FUXIA no cobra comisi\xF3n sobre pauta.

ADD-ONS
- Sesi\xF3n de fotos: $350.000.
- Reel extra: $250.000.
- Email marketing: $450.000/mes.
- Auditor\xEDa de embudo: $300.000.

REGLA
No vender horas. Vender sistema, entregables y resultados.`},reel1:{t:"Guion reel D\xEDa 1 \u2014 Ferney",txt:`IG @ferneypamplona \xB7 35-40s \xB7 9:16 \xB7 Publicar d\xEDa 1, 12:00-14:00
